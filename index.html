<title>SAIFAH SETUP THAI — สอนตั้งค่าภาษา Magic Core Cloud</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M35 6 14 36h13l-4 22 23-32H33l2-20z' fill='%232fe8ff'/%3E%3C/svg%3E">

<style>
:root {
  --bg:          #05070d;
  --surface:     #0b0e1c;
  --surface-2:   #111629;
  --line:        #1c2440;
  --line-bright: #2c3868;
  --cyan:        #2fe8ff;
  --pink:        #ff3fa4;
  --violet:      #8b6bff;
  --text-hi:     #f1f4ff;
  --text-mid:    #8a93bf;
  --text-low:    #4d5578;
  --gold:        #ffcc33;
  --gold-off:    #2a3350;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-hi);
  font-family: 'Kanit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

/* moving circuit-grid backdrop */
body::before {
  content: "";
  position: fixed;
  inset: -10%;
  background-image:
    linear-gradient(rgba(47,232,255,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,232,255,0.055) 1px, transparent 1px);
  background-size: 46px 46px;
  animation: gridDrift 26s linear infinite;
  z-index: 0;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  inset: -6%;
  background:
    radial-gradient(circle at 12% 8%, rgba(47,232,255,0.16), transparent 40%),
    radial-gradient(circle at 96% 30%, rgba(255,63,164,0.13), transparent 45%),
    radial-gradient(circle at 40% 100%, rgba(139,107,255,0.10), transparent 40%);
  z-index: 0;
  pointer-events: none;
  animation: glowDrift 13s ease-in-out infinite;
}

@keyframes glowDrift {
  0%, 100% { opacity: 0.85; transform: translate(0, 0) scale(1); }
  50%      { opacity: 1;    transform: translate(-1.5%, 1.5%) scale(1.03); }
}

@keyframes gridDrift {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 46px 46px, 46px 46px; }
}

/* ---------- Floating particles ---------- */

.fx-particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.fx-particle {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  opacity: 0;
  animation: particleRise var(--dur, 16s) linear var(--delay, 0s) infinite;
  box-shadow: 0 0 6px 1px currentColor;
}

@keyframes particleRise {
  0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
  8%   { opacity: var(--op, 0.7); }
  88%  { opacity: var(--op, 0.7); }
  100% { transform: translate(var(--drift, 24px), -112vh) scale(1); opacity: 0; }
}

/* ---------- Circuit trace decoration ---------- */

.circuit {
  position: absolute;
  top: 6px;
  right: 4px;
  width: 230px;
  height: 150px;
  opacity: 0.7;
  pointer-events: none;
  z-index: 0;
}

.circuit svg { width: 100%; height: 100%; }

.circuit-base { fill: none; stroke: var(--line-bright); stroke-width: 1.4; opacity: 0.6; }

.circuit-pulse {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 2;
  stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--cyan));
  stroke-dasharray: 14 400;
  animation: pulseTravel 3.4s linear infinite;
}

.circuit-pulse--pink {
  stroke: var(--pink);
  filter: drop-shadow(0 0 4px var(--pink));
  animation-duration: 4.6s;
  animation-delay: -1.6s;
}

@keyframes pulseTravel {
  from { stroke-dashoffset: 0; }
  to   { stroke-dashoffset: -400; }
}

a { text-decoration: none; color: inherit; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

h1, h2, h3 { font-family: 'Chakra Petch', sans-serif; margin: 0; }

/* ---------- Topbar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5, 7, 13, 0.78);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.topbar__glow {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  opacity: 0.7;
}

.topbar__inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 15px 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(155deg, #142042, #0a0d1a);
  border: 1px solid var(--line-bright);
  color: var(--cyan);
  flex-shrink: 0;
  animation: boltPulse 3.2s ease-in-out infinite;
}

.logo__bolt { width: 18px; height: 18px; }

@keyframes boltPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(47,232,255,0.0), inset 0 0 8px rgba(47,232,255,0.08); }
  50%      { box-shadow: 0 0 16px 2px rgba(47,232,255,0.45), inset 0 0 10px rgba(47,232,255,0.22); }
}

.logo__text {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-hi);
}

.logo__text span {
  font-weight: 400;
  color: var(--text-mid);
  margin-left: 4px;
}

/* ---------- Hero / Intro ---------- */

.intro {
  position: relative;
  z-index: 1;
  padding: 56px 20px 40px;
}

.intro__inner {
  max-width: 960px;
  margin: 0 auto;
}

.intro__eyebrow {
  display: inline-flex;
  align-items: center;
  margin: 0 0 14px;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.4px;
  color: var(--cyan);
}

.intro__eyebrow::after {
  content: "_";
  margin-left: 3px;
  animation: blink 1.1s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.intro__title {
  font-size: clamp(28px, 6vw, 42px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: 0.2px;
  background: linear-gradient(100deg, #ffffff 10%, var(--cyan) 55%, var(--pink) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin: 0 0 18px;
  animation: titleReveal 1.1s ease-out 1;
}

@keyframes titleReveal {
  0%   { opacity: 0; filter: blur(2px); text-shadow: 3px 0 var(--pink), -3px 0 var(--cyan); transform: translateX(-6px); }
  25%  { opacity: 1; text-shadow: -3px 0 var(--pink), 3px 0 var(--cyan); transform: translateX(4px); }
  45%  { text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan); transform: translateX(-2px); }
  70%  { text-shadow: none; transform: translateX(0); filter: blur(0); }
  100% { opacity: 1; }
}

.intro__desc {
  max-width: 58ch;
  margin: 0;
  font-size: 15.5px;
  line-height: 1.85;
  font-weight: 300;
  color: var(--text-mid);
}

/* ---------- Section divider ---------- */

.section-divider {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.section-divider__label {
  flex-shrink: 0;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.4px;
  color: var(--text-mid);
}

.section-divider__line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-bright), transparent);
}

/* ---------- Game grid ---------- */

.game-section {
  position: relative;
  z-index: 1;
  padding: 22px 20px 90px;
}

.game-section__inner {
  max-width: 960px;
  margin: 0 auto;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 22px;
}

.game-card {
  display: block;
  position: relative;
  background: linear-gradient(165deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
}

.game-card:not(.game-card--empty):hover,
.game-card:not(.game-card--empty):focus-visible {
  border-color: var(--cyan);
  transform: translateY(-3px);
  box-shadow: 0 10px 28px -12px rgba(47,232,255,0.35), 0 0 0 1px rgba(47,232,255,0.15);
}

.game-card__thumb {
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  overflow: hidden;
  background: var(--surface-2);
}

.game-card__thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.game-card:hover .game-card__thumb img {
  transform: scale(1.06);
}

.corner {
  position: absolute;
  width: 14px;
  height: 14px;
  border-color: var(--cyan);
  opacity: 0.45;
  z-index: 2;
  pointer-events: none;
  transition: opacity 0.25s ease, border-color 0.25s ease;
}
.corner--tl { top: 7px; left: 7px; border-top: 2px solid; border-left: 2px solid; }
.corner--tr { top: 7px; right: 7px; border-top: 2px solid; border-right: 2px solid; }
.corner--bl { bottom: 7px; left: 7px; border-bottom: 2px solid; border-left: 2px solid; }
.corner--br { bottom: 7px; right: 7px; border-bottom: 2px solid; border-right: 2px solid; }

.game-card:hover .corner { opacity: 0.95; border-color: var(--pink); }

.game-card__lang {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  padding: 3px 9px;
  border-radius: 999px;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text-hi);
  background: rgba(6, 9, 18, 0.75);
  border: 1px solid var(--lang-color, var(--cyan));
  box-shadow: 0 0 8px -1px var(--lang-color, var(--cyan));
  backdrop-filter: blur(4px);
  letter-spacing: 0.2px;
}

.game-card__thumb--empty {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-low);
  background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 10px, var(--surface) 10px, var(--surface) 20px);
}

.game-card--empty {
  border-style: dashed;
  border-color: var(--line-bright);
}

.game-card__placeholder-icon { width: 32%; height: 32%; opacity: 0.5; }

.game-card__body { padding: 12px 14px 16px; }

.game-card__title {
  font-family: 'Chakra Petch', sans-serif;
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-hi);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-card__title--empty { color: var(--text-low); font-weight: 400; }

.star-rating { display: flex; align-items: center; gap: 3px; }
.star { width: 15px; height: 15px; }
.star--filled, .star--full { fill: var(--gold); filter: drop-shadow(0 0 3px rgba(255,204,51,0.45)); }
.star--empty { fill: var(--gold-off); }

/* ---------- Footer ---------- */

.footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--line);
  padding: 24px 20px;
  text-align: center;
}

.footer::before {
  content: "";
  display: block;
  height: 1px;
  max-width: 960px;
  margin: 0 auto 24px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  opacity: 0.5;
}

.footer p { margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 12.5px; color: var(--text-low); letter-spacing: 0.3px; }

@media (max-width: 420px) {
  .game-grid { gap: 12px; }
  .game-card__body { padding: 10px 11px 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="fx-particles" id="fxParticles" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar__inner">
    <div class="logo">
      <span class="logo__mark">
        <svg class="logo__bolt" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M35 6 14 36h13l-4 22 23-32H33l2-20z" fill="currentColor"/>
        </svg>
      </span>
      <span class="logo__text">SAIFAH <span>SETUP THAI</span></span>
    </div>
  </div>
  <div class="topbar__glow"></div>
</header>

<section class="intro">
  <div class="circuit" aria-hidden="true">
    <svg viewBox="0 0 230 150">
      <path class="circuit-base" d="M6,120 L60,120 L60,50 L170,50 L170,16 L224,16" />
      <path class="circuit-pulse" d="M6,120 L60,120 L60,50 L170,50 L170,16 L224,16" />
      <path class="circuit-base" d="M20,140 L20,90 L100,90 L100,64" />
      <path class="circuit-pulse circuit-pulse--pink" d="M20,140 L20,90 L100,90 L100,64" />
    </svg>

    <p class="intro__eyebrow">// คู่มือตั้งค่าเกม</p>
    <h1 class="intro__title">สอนตั้งค่าภาษา<br>ในแอพ Magic Core Cloud</h1>
    <p class="intro__desc">
      เว็บไซต์นี้จะสอนตั้งค่า ภาษาไทยหรืออังกฤษ เกมต่างๆ ที่สามารถตั้งค่าได้ในแอพ Magic Core Cloud
      เลือกเกมที่ต้องการด้านล่าง แล้วทำตามขั้นตอนได้เลย
    </p>

<div class="section-divider">
  <span class="section-divider__label">// รายการเกม</span>

<main class="game-section">
  <div class="game-section__inner">
    <div class="game-grid" id="gameGrid">
      <!-- การ์ดเกมจริง + ช่องว่างเตรียมไว้ ถูกสร้างโดย JavaScript ด้านล่าง -->
    </div>
  </div>
</main>

<script>
/* ============================================
   SAIFAH SETUP THAI — game grid renderer
   เพิ่มข้อมูลเกมลงใน "games" array ด้านล่าง
   แล้วฟังก์ชัน renderGames() จะสร้างการ์ดให้อัตโนมัติ
   ============================================ */

const games = [
  {
    title: "Marvel's Spider-Man 2",
    image: "images/marvels-spider-man-2.jpg",
    rating: 4.5,
    lang: "ภาษาไทย",
    langColor: "#2fe8ff",
    url: "setup/marvels-spider-man-2.html"
  },
  {
    title: "Watch Dogs 2",
    image: "images/watch-dogs-2.jpg",
    rating: 4,
    lang: "ภาษาอังกฤษ",
    langColor: "#ff3fa4",
    url: "setup/watch-dogs-2.html"
  },
];

// จำนวนช่องว่าง "เตรียมไว้" ที่จะแสดงต่อท้ายรายการเกมจริงเสมอ
const emptySlotCount = 0;

let starGradientCount = 0;

function createStarSVG(state) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "star star--" + state);
  const starPath = "M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z";

  if (state === "half") {
    starGradientCount += 1;
    const gradId = `star-half-grad-${starGradientCount}`;
    const defs = document.createElementNS(ns, "defs");
    const grad = document.createElementNS(ns, "linearGradient");
    grad.setAttribute("id", gradId);
    grad.setAttribute("x1", "0%"); grad.setAttribute("x2", "100%");
    grad.setAttribute("y1", "0%"); grad.setAttribute("y2", "0%");
    const stop1 = document.createElementNS(ns, "stop");
    stop1.setAttribute("offset", "50%"); stop1.setAttribute("stop-color", "var(--gold)");
    const stop2 = document.createElementNS(ns, "stop");
    stop2.setAttribute("offset", "50%"); stop2.setAttribute("stop-color", "var(--gold-off)");
    grad.appendChild(stop1); grad.appendChild(stop2); defs.appendChild(grad); svg.appendChild(defs);
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", starPath);
    path.setAttribute("fill", `url(#${gradId})`);
    svg.appendChild(path);
    return svg;
  }

  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", starPath);
  svg.appendChild(path);
  return svg;
}

function buildStarRating(rating) {
  const wrap = document.createElement("div");
  wrap.className = "star-rating";
  wrap.setAttribute("aria-label", `คะแนน ${rating} จาก 5 ดาว`);
  const fullStars = Math.floor(rating);
  const hasHalf = rating % 1 >= 0.25 && rating % 1 < 0.75;
  const roundsUpToFull = rating % 1 >= 0.75;
  for (let i = 1; i <= 5; i++) {
    let state = "empty";
    if (i <= fullStars) state = "full";
    else if (i === fullStars + 1 && roundsUpToFull) state = "full";
    else if (i === fullStars + 1 && hasHalf) state = "half";
    wrap.appendChild(createStarSVG(state));
  }
  return wrap;
}

function buildCorners() {
  const frag = document.createDocumentFragment();
  ["tl", "tr", "bl", "br"].forEach((pos) => {
    const span = document.createElement("span");
    span.className = `corner corner--${pos}`;
    frag.appendChild(span);
  });
  return frag;
}

function buildGameCard(game) {
  const card = document.createElement("a");
  card.className = "game-card";
  card.href = game.url || "#";

  const thumb = document.createElement("div");
  thumb.className = "game-card__thumb";

  if (game.lang) {
    const badge = document.createElement("span");
    badge.className = "game-card__lang";
    badge.textContent = game.lang;
    if (game.langColor) badge.style.setProperty("--lang-color", game.langColor);
    thumb.appendChild(badge);
  }

  const img = document.createElement("img");
  img.src = game.image;
  img.alt = game.title;
  thumb.appendChild(img);
  thumb.appendChild(buildCorners());

  const body = document.createElement("div");
  body.className = "game-card__body";

  const title = document.createElement("h3");
  title.className = "game-card__title";
  title.textContent = game.title;

  body.appendChild(title);
  body.appendChild(buildStarRating(game.rating || 0));

  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

function buildEmptySlotCard() {
  const ns = "http://www.w3.org/2000/svg";
  const card = document.createElement("a");
  card.className = "game-card game-card--empty";
  card.href = "#";
  card.setAttribute("aria-disabled", "true");

  const thumb = document.createElement("div");
  thumb.className = "game-card__thumb game-card__thumb--empty";

  const icon = document.createElementNS(ns, "svg");
  icon.setAttribute("class", "game-card__placeholder-icon");
  icon.setAttribute("viewBox", "0 0 64 64");
  icon.setAttribute("fill", "none");
  icon.innerHTML =
    '<rect x="6" y="14" width="52" height="38" rx="4" stroke="currentColor" stroke-width="2.5"/>' +
    '<circle cx="22" cy="28" r="3.5" fill="currentColor"/>' +
    '<path d="M10 46L24 34L34 42L44 32L54 44" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  thumb.appendChild(icon);

  const body = document.createElement("div");
  body.className = "game-card__body";

  const title = document.createElement("h3");
  title.className = "game-card__title game-card__title--empty";
  title.textContent = "ยังไม่มีข้อมูลเกม";

  body.appendChild(title);
  body.appendChild(buildStarRating(0));

  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

function renderGames() {
  const grid = document.getElementById("gameGrid");
  games.forEach((game) => grid.appendChild(buildGameCard(game)));
  for (let i = 0; i < emptySlotCount; i++) grid.appendChild(buildEmptySlotCard());
}

renderGames();

// ---------- Floating background particles ----------
function initParticles() {
  const holder = document.getElementById("fxParticles");
  if (!holder) return;
  const colors = ["#2fe8ff", "#ff3fa4", "#8b6bff"];
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    p.className = "fx-particle";
    const size = (Math.random() * 3 + 2).toFixed(1);
    const left = (Math.random() * 100).toFixed(1);
    const dur = (Math.random() * 12 + 12).toFixed(1);
    const delay = (Math.random() * -24).toFixed(1);
    const drift = (Math.random() * 60 - 30).toFixed(0);
    const op = (Math.random() * 0.4 + 0.4).toFixed(2);
    const color = colors[i % colors.length];
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = left + "%";
    p.style.color = color;
    p.style.background = color;
    p.style.setProperty("--dur", dur + "s");
    p.style.setProperty("--delay", delay + "s");
    p.style.setProperty("--drift", drift + "px");
    p.style.setProperty("--op", op);
    holder.appendChild(p);
  }
}
initParticles();
</script>
