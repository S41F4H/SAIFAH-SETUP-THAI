<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>วิธีตั้งค่าภาษาไทย — Watch Dogs 2 | SAIFAH SETUP THAI</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060a14'/%3E%3Cpath d='M35 6 14 36h13l-4 22 23-32H33l2-20z' fill='%233d7dff'/%3E%3C/svg%3E">

<style>
:root {
  --bg-base:      #060a14;
  --bg-raised:    #0c1324;
  --bg-card:      #101a30;
  --line:         #1c2740;
  --blue-accent:  #3d7dff;
  --blue-glow:    #1c3f8f;
  --text-hi:      #eef1f8;
  --text-mid:     #9aa6c3;
  --text-low:     #5b6584;
  --star-gold:    #ffc23c;
  --star-off:     #2a3350;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg-base);
  background-image:
    radial-gradient(circle at 15% 0%, var(--blue-glow) 0%, transparent 38%),
    radial-gradient(circle at 100% 20%, #10204a 0%, transparent 45%);
  background-attachment: fixed;
  color: var(--text-hi);
  font-family: 'Kanit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}

a { text-decoration: none; color: inherit; }

/* ---------- Topbar ---------- */

.topbar {
  border-bottom: 1px solid var(--line);
  background: rgba(6, 10, 20, 0.85);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar__inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--line);
  color: var(--text-mid);
  flex-shrink: 0;
  transition: border-color 0.2s ease, color 0.2s ease;
}

.back-link:hover {
  border-color: var(--blue-accent);
  color: var(--text-hi);
}

.back-link svg {
  width: 16px;
  height: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(145deg, var(--blue-accent), #1a3d8f);
  color: #fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 6px 16px -6px rgba(61,125,255,0.65);
  flex-shrink: 0;
}

.logo__bolt {
  width: 16px;
  height: 16px;
}

.logo__text {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-hi);
}

.logo__text span {
  font-weight: 300;
  color: var(--text-mid);
  margin-left: 3px;
}

/* ---------- Game header ---------- */

.game-header {
  padding: 44px 20px 30px;
  border-bottom: 1px solid var(--line);
}

.game-header__inner {
  max-width: 720px;
  margin: 0 auto;
}

.game-header__eyebrow {
  margin: 0 0 10px;
  font-size: 14px;
  font-weight: 400;
  color: var(--blue-accent);
}

.game-header__title {
  margin: 0 0 14px;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 600;
  line-height: 1.3;
}

.star-rating {
  display: flex;
  align-items: center;
  gap: 3px;
}

.star {
  width: 16px;
  height: 16px;
}

.star--filled,
.star--full {
  fill: var(--star-gold);
}

.star--empty {
  fill: var(--star-off);
}

/* ---------- Steps ---------- */

.steps {
  padding: 40px 20px 80px;
}

.steps__inner {
  max-width: 720px;
  margin: 0 auto;
}

.step {
  display: flex;
  gap: 16px;
  padding-bottom: 40px;
  margin-bottom: 40px;
  border-bottom: 1px solid var(--line);
}

.step:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.step__number {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--blue-accent);
}

.step__content {
  flex: 1;
  min-width: 0;
}

.step__text {
  margin: 6px 0 16px;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.75;
  color: var(--text-hi);
}

.step__text b {
  color: var(--blue-accent);
  font-weight: 500;
}

.step__image {
  display: block;
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--line);
  overflow: hidden;
}

.step__image img {
  display: block;
  width: 100%;
  height: auto;
}

/* ---------- Footer ---------- */

.footer {
  border-top: 1px solid var(--line);
  padding: 22px 20px;
  text-align: center;
}

.footer p {
  margin: 0;
  font-size: 13px;
  color: var(--text-low);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="back-link" href="../index.html" aria-label="กลับหน้าหลัก">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="logo">
      <span class="logo__mark">
        <svg class="logo__bolt" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M35 6 14 36h13l-4 22 23-32H33l2-20z" fill="currentColor"/>
        </svg>
      </span>
      <span class="logo__text">SAIFAH <span>SETUP THAI</span></span>
    </div>
  </div>
</header>

<section class="game-header">
  <div class="game-header__inner">
    <p class="game-header__eyebrow">วิธีตั้งค่าภาษาอังกฤษ</p>
    <h1 class="game-header__title">Watch Dogs 2</h1>
    <div class="star-rating" aria-label="คะแนน 4 จาก 5 ดาว">
      <svg class="star star--full" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
      <svg class="star star--full" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
      <svg class="star star--full" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
      <svg class="star star--full" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
      <svg class="star star--empty" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>
    </div>
  </div>
</section>

<main class="steps">
  <div class="steps__inner">

    <div class="step">
      <div class="step__number">1</div>
      <div class="step__content">
        <p class="step__text">เข้าเกม แล้วในเมนูหลักให้เลือกเมนู <b>设置</b></p>
        <div class="step__image">
          <img src="../images/steps/watch-dogs-2-step1.jpg" alt="ขั้นตอนที่ 1 เลือกเมนู 设置 ใน Watch Dogs 2">
        </div>
      </div>
    </div>

    <!-- ขั้นตอนถัดไป: เพิ่มบล็อก .step แบบนี้ต่อท้ายเรื่อยๆ -->

  </div>
</main>

<footer class="footer">
  <p>© 2026 SAIFAH SETUP THAI</p>
</footer>

</body>
</html>
