<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M35 6 14 36h13l-4 22 23-32H33l2-20z' fill='%232fe8ff'/%3E%3C/svg%3E">

<style>
:root {
  --bg:          #05070d;
  --surface:     #0b0e1c;
  --surface-2:   #111629;
  --line:        #1c2440;
  --line-bright: #2c3868;
  --cyan:        #2fe8ff;
  --pink:        #ff3fa4;
  --violet:      #8b6bff;
  --text-hi:     #f1f4ff;
  --text-mid:    #8a93bf;
  --text-low:    #4d5578;
  --gold:        #ffcc33;
  --gold-off:    #2a3350;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text-hi);
  font-family: 'Kanit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -10%;
  background-image:
    linear-gradient(rgba(47,232,255,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,232,255,0.055) 1px, transparent 1px);
  background-size: 46px 46px;
  animation: gridDrift 26s linear infinite;
  z-index: 0;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  inset: -6%;
  background:
    radial-gradient(circle at 12% 8%, rgba(47,232,255,0.14), transparent 40%),
    radial-gradient(circle at 96% 20%, rgba(255,63,164,0.12), transparent 45%);
  z-index: 0;
  pointer-events: none;
  animation: glowDrift 13s ease-in-out infinite;
}

@keyframes glowDrift {
  0%, 100% { opacity: 0.85; transform: translate(0, 0) scale(1); }
  50%      { opacity: 1;    transform: translate(-1.5%, 1.5%) scale(1.03); }
}

@keyframes gridDrift {
  from { background-position: 0 0, 0 0; }
  to   { background-position: 46px 46px, 46px 46px; }
}

/* ---------- Floating particles ---------- */

.fx-particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

.fx-particle {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  opacity: 0;
  animation: particleRise var(--dur, 16s) linear var(--delay, 0s) infinite;
  box-shadow: 0 0 6px 1px currentColor;
}

@keyframes particleRise {
  0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
  8%   { opacity: var(--op, 0.7); }
  88%  { opacity: var(--op, 0.7); }
  100% { transform: translate(var(--drift, 24px), -112vh) scale(1); opacity: 0; }
}

/* ---------- Circuit trace decoration ---------- */

.circuit { position: absolute; top: 2px; right: 2px; width: 160px; height: 100px; opacity: 0.7; pointer-events: none; z-index: 0; }
.circuit svg { width: 100%; height: 100%; }
.circuit-base { fill: none; stroke: var(--line-bright); stroke-width: 1.4; opacity: 0.6; }
.circuit-pulse {
  fill: none; stroke: var(--pink); stroke-width: 2; stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--pink));
  stroke-dasharray: 12 300;
  animation: pulseTravel 3.2s linear infinite;
}
@keyframes pulseTravel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -300; } }

a { text-decoration: none; color: inherit; }
a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

h1, h2, h3 { font-family: 'Chakra Petch', sans-serif; margin: 0; }

/* ---------- Topbar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5, 7, 13, 0.78);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.topbar__glow {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  opacity: 0.7;
}

.topbar__inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid var(--line-bright);
  background: var(--surface-2);
  color: var(--text-mid);
  flex-shrink: 0;
  transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}

.back-link:hover, .back-link:focus-visible {
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: 0 0 10px -1px rgba(47,232,255,0.5);
}

.back-link svg { width: 16px; height: 16px; }

.logo { display: flex; align-items: center; gap: 10px; }

.logo__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(155deg, #142042, #0a0d1a);
  border: 1px solid var(--line-bright);
  color: var(--cyan);
  flex-shrink: 0;
  animation: boltPulse 3.2s ease-in-out infinite;
}

@keyframes boltPulse {
  0%, 100% { box-shadow: inset 0 0 8px rgba(47,232,255,0.08); }
  50%      { box-shadow: 0 0 16px 2px rgba(47,232,255,0.45), inset 0 0 10px rgba(47,232,255,0.22); }
}

.logo__bolt { width: 16px; height: 16px; }

.logo__text {
  font-family: 'Chakra Petch', sans-serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text-hi);
}

.logo__text span { font-weight: 400; color: var(--text-mid); margin-left: 3px; }

/* ---------- Game header ---------- */

.game-header {
  position: relative;
  z-index: 1;
  padding: 44px 20px 30px;
  border-bottom: 1px solid var(--line);
}

.game-header__inner { max-width: 720px; margin: 0 auto; }

.game-header__eyebrow {
  display: inline-flex;
  margin: 0 0 12px;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--cyan);
}

.game-header__title {
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700;
  line-height: 1.3;
  margin: 0 0 16px;
  background: linear-gradient(100deg, #ffffff 15%, var(--cyan) 60%, var(--pink) 110%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.star-rating { display: flex; align-items: center; gap: 3px; }
.star { width: 16px; height: 16px; }
.star--filled, .star--full { fill: var(--gold); filter: drop-shadow(0 0 3px rgba(255,204,51,0.45)); }
.star--empty { fill: var(--gold-off); }

/* ---------- Steps ---------- */

.steps { position: relative; z-index: 1; padding: 44px 20px 90px; }
.steps__inner { max-width: 720px; margin: 0 auto; }

.step {
  position: relative;
  display: flex;
  gap: 18px;
  padding-bottom: 40px;
}

.step:not(:last-child)::before {
  content: "";
  position: absolute;
  top: 34px;
  left: 17px;
  width: 1px;
  height: calc(100% - 20px);
  background: linear-gradient(var(--line-bright), transparent);
}

.step__number {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--surface-2);
  border: 1px solid var(--line-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Chakra Petch', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--cyan);
  box-shadow: 0 0 10px -2px rgba(47,232,255,0.45);
  position: relative;
  z-index: 1;
}

.step__content { flex: 1; min-width: 0; padding-top: 4px; }

.step__text {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.8;
  color: var(--text-hi);
}

.step__text b {
  font-family: 'Chakra Petch', sans-serif;
  color: var(--cyan);
  font-weight: 600;
  text-shadow: 0 0 8px rgba(47,232,255,0.35);
}

.step__image {
  position: relative;
  display: block;
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--line);
  overflow: hidden;
  background: var(--surface-2);
}

.step__image img { display: block; width: 100%; height: auto; }

.step__image .corner { position: absolute; width: 16px; height: 16px; border-color: var(--pink); opacity: 0.7; pointer-events: none; }
.step__image .corner--tl { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
.step__image .corner--tr { top: 8px; right: 8px; border-top: 2px solid; border-right: 2px solid; }
.step__image .corner--bl { bottom: 8px; left: 8px; border-bottom: 2px solid; border-left: 2px solid; }
.step__image .corner--br { bottom: 8px; right: 8px; border-bottom: 2px solid; border-right: 2px solid; }

/* ---------- Footer ---------- */

.footer { position: relative; z-index: 1; border-top: 1px solid var(--line); padding: 24px 20px; text-align: center; }
.footer::before {
  content: "";
  display: block;
  height: 1px;
  max-width: 720px;
  margin: 0 auto 24px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  opacity: 0.5;
}
.footer p { margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 12.5px; color: var(--text-low); letter-spacing: 0.3px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
function initParticles() {
  const holder = document.getElementById("fxParticles");
  if (!holder) return;
  const colors = ["#2fe8ff", "#ff3fa4", "#8b6bff"];
  const count = 16;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    p.className = "fx-particle";
    const size = (Math.random() * 3 + 2).toFixed(1);
    const left = (Math.random() * 100).toFixed(1);
    const dur = (Math.random() * 12 + 12).toFixed(1);
    const delay = (Math.random() * -24).toFixed(1);
    const drift = (Math.random() * 60 - 30).toFixed(0);
    const op = (Math.random() * 0.4 + 0.4).toFixed(2);
    const color = colors[i % colors.length];
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = left + "%";
    p.style.color = color;
    p.style.background = color;
    p.style.setProperty("--dur", dur + "s");
    p.style.setProperty("--delay", delay + "s");
    p.style.setProperty("--drift", drift + "px");
    p.style.setProperty("--op", op);
    holder.appendChild(p);
  }
}
initParticles();
</script>
